name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: nfw
          POSTGRES_PASSWORD: nfw_local_dev
          POSTGRES_DB: noteforwork
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U nfw" --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
    env:
      DATABASE_URL: postgresql://nfw:nfw_local_dev@localhost:5432/noteforwork
      REDIS_URL: redis://localhost:6379
      NODE_ENV: test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Migrate and seed test database (fake data only)
        run: |
          pnpm --filter @nfw/db generate
          pnpm --filter @nfw/db migrate:deploy
          pnpm --filter @nfw/db seed
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - name: Fail if secrets leak into client bundles
        run: |
          if grep -rEl "sk_(live|test)_|x-api-key|DATABASE_URL|BEGIN (RSA|EC) PRIVATE KEY" apps/app/.next/static apps/marketing/.next/static; then
            echo "Secret-like string found in a client bundle"; exit 1
          fi
