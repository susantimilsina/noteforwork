packages:
  - "apps/*"
  - "packages/*"

# pnpm 11 blocks dependency install scripts by default; allow only the ones we need.
allowBuilds:
  esbuild: true
  prisma: true
  "@prisma/engines": true
  "@prisma/client": true
  "@swc/core": true
  sharp: true
  unrs-resolver: true
  msgpackr-extract: true
